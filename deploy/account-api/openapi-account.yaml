            type: string
            description: 客户端生成的 UUID（同一次播放唯一）
          track_id:
            type: string
          played_at:
            type: string
            format: date-time
          position_ms:
            type: integer
            minimum: 0
          duration_ms:
            type: integer
            minimum: 0
          platform:
            type: string
        description: 服务端每用户保留最新 500 条
    PageMeta:
      type: object
      required:
      - next_cursor
      - has_more
      properties:
        next_cursor:
          type: string
          description: 下次增量同步要带的游标；即使 has_more=false 也要保存
        has_more:
          type: boolean
        server_time:
          type: string
          format: date-time
    FavoritePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
