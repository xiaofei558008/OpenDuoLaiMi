<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open AI 音乐</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1020;color:#eee}
header{padding:14px 20px;background:linear-gradient(90deg,#6a3cff,#e2468f);display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}header small{font-weight:400;opacity:.85;font-size:13px}
main{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;max-width:1300px;margin:auto;padding-bottom:120px}
.card{background:#1a1b30;border-radius:14px;padding:14px}h3{margin:0 0 10px;font-size:15px;opacity:.8}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.item:hover{background:#25264a}.item.on{background:#33266b}
.item img{width:52px;height:52px;border-radius:8px}.item b{display:block;font-size:15px}.singer{font-size:16px;color:#ffb3d4;margin-top:2px}.item span{font-size:12px;opacity:.65}
.now{text-align:center}
.stage{position:relative;width:100%;max-width:620px;margin:auto;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #000a;background:#000}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .mask{position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,#000a 50%,#0008 100%)}
#lyr{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
#lw{position:absolute;left:0;right:0;top:50%;transition:transform .45s ease}
.ln{padding:6px 18px;font-size:17px;line-height:1.5;color:#ffffff73;transition:color .3s,font-size .3s,opacity .3s;text-shadow:0 1px 3px #000}
.ln.done{color:#ffb3d4aa}
.ln.cur{font-size:23px;font-weight:700;color:transparent;text-shadow:none;background:linear-gradient(90deg,#ff5fa8 0,#ffd36e calc(var(--p)*100%),#ffffffd9 calc(var(--p)*100%),#ffffffd9 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 3px #000)}
.ln.far{opacity:.0}
.nolrc{position:absolute;inset:0;overflow-y:auto;padding:30px 18px;white-space:pre-line;line-height:1.9;color:#ffffffcc}
.now h1{margin:16px 0 6px;font-size:26px}.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:#2b2c50}.ai{background:#e2468f}
.theme{opacity:.7;font-size:14px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#161728ee;backdrop-filter:blur(8px);padding:10px 18px;display:flex;align-items:center;gap:14px;border-top:1px solid #333}
.bar button{background:none;border:0;color:#eee;font-size:20px;cursor:pointer;padding:6px}.bar .pp{width:46px;height:46px;border-radius:50%;background:#e2468f}
.bar button.off{opacity:.35}.prog{flex:1;display:flex;align-items:center;gap:8px;font-size:12px}input[type=range]{accent-color:#e2468f}.prog input{flex:1}
.bar a{color:#eee;text-decoration:none;font-size:18px}
footer{text-align:center;font-size:12px;opacity:.6;padding:10px 20px 100px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:10px}.now{order:-1}.ln{font-size:15px;padding:4px 12px}.ln.cur{font-size:19px}.vol{display:none}.bar{gap:6px;padding:8px}}
</style>__UMAMI__</head><body>
<header><span id="sn">Open AI 音乐</span><small>开源 · 免费 · AI 原创音乐</small></header>
<main><section class="card"><h3>歌曲列表</h3><div id="list"></div></section>
<section class="card now"><div class="stage" id="stg"><img id="cv" alt=""><video id="mv" playsinline muted hidden></video><div class="mask"></div><div id="lyr"><div id="lw"></div></div></div><h1 id="tt">加载中…</h1><div class="singer" id="sg"></div><div class="tags" id="tg"></div><div class="theme" id="th"></div></section></main>
<footer>本站所有歌曲均由 AI 生成，许可协议 CC BY 4.0（以平台条款为准）· © <span id="sn2"></span></footer>
<div class="bar"><button id="sh" class="off" title="随机">🔀</button><button id="pv" title="上一首">⏮</button><button id="pp" class="pp" title="播放">▶</button><button id="nx" title="下一首">⏭</button><button id="rp" class="off" title="循环">🔁</button>
<div class="prog"><span id="cur">0:00</span><input id="sk" type="range" min="0" max="1000" value="0"><span id="tot">0:00</span></div>
<span class="vol">🔊<input id="vl" type="range" min="0" max="1" step="0.01" value="0.8"></span><a id="dl" download title="下载">⬇</a></div>
<audio id="au" preload="metadata"></audio>
<script>
const h=location.hostname,name=h.includes('doremi')?'OpenDoremi':'OpenDuolaimi';sn.textContent=sn2.textContent=name;document.title=name+' · 开源 AI 音乐';
let S=[],i=0,shuf=false,rep=false;const f=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
fetch('/songs/catalog.json').then(r=>r.json()).then(d=>{S=d;list.innerHTML=d.map((s,k)=>`<div class="item" data-k="${k}"><img src="${s.cover}" alt=""><div><b>${s.title}</b><span>${s.singer||''} · ${s.genre} · ${f(s.duration)}</span></div></div>`).join('');list.onclick=e=>{const t=e.target.closest('.item');if(t){load(+t.dataset.k);au.play()}};load(0)});
function load(k){i=k;const s=S[k];au.src=s.mp3;cv.src=s.cover;tt.textContent=s.title;sg.textContent=s.singer?'演唱：'+s.singer:'';th.textContent='主题：'+s.theme;dl.href=s.mp3;dl.download=(s.singer?s.singer+' - ':'')+s.title+'.mp3';document.title=s.title+' - '+(s.singer||'')+' · '+name;
tg.innerHTML=`<span class="tag ai">AI生成</span>`+[s.genre,s.mood,s.vocal].map(x=>`<span class="tag">${x}</span>`).join('');
setMedia(s);loadLyrics(s);tot.textContent=f(s.duration);
document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',+e.dataset.k==k));}
let L=null,cl=-1;
function setMedia(s){if(s.video){mv.src=s.video;mv.hidden=false;cv.hidden=true;}else{mv.removeAttribute('src');mv.hidden=true;cv.hidden=false;}}
function plain(s){L=null;lw.style.transform='none';lw.style.top='0';lw.innerHTML='<div class="nolrc">'+s.lyrics.split('\n').filter(l=>!/^\[.*\]$/.test(l.trim())).join('\n')+'</div>';}
function loadLyrics(s){L=null;cl=-1;lw.innerHTML='';lw.style.top='50%';if(!s.timed){plain(s);return}const k=i;
fetch(s.timed).then(r=>r.json()).then(d=>{if(k!==i)return;L=d;lw.innerHTML=d.map((l,j)=>`<div class="ln" data-j="${j}">${l.text}</div>`).join('');cl=-2;sync()}).catch(()=>plain(s));}
function prog(l,t){if(t<=l.start)return 0;if(t>=l.end)return 1;const w=l.words||[];if(!w.length)return (t-l.start)/(l.end-l.start);let n=0;for(const x of w){if(t>=x.end)n++;else if(t>x.start){n+=(t-x.start)/(x.end-x.start);break}else break}return n/w.length}
function sync(){if(!L)return;const t=au.currentTime;let c=-1;for(let j=0;j<L.length;j++){if(L[j].start<=t)c=j;else break}
const els=lw.children;if(c!==cl){cl=c;for(let j=0;j<els.length;j++){const e=els[j];e.classList.toggle('done',j<c);e.classList.toggle('cur',j==c);e.classList.toggle('far',Math.abs(j-Math.max(c,0))>3);if(j!=c)e.style.removeProperty('--p')}
const e=els[Math.max(c,0)];if(e)lw.style.transform=`translateY(${-(e.offsetTop+e.offsetHeight/2)}px)`}
if(c>=0&&els[c]){const nx=L[c+1];const l=L[c];els[c].style.setProperty('--p',prog(l,t).toFixed(3))}}
function tick(){sync();requestAnimationFrame(tick)}requestAnimationFrame(tick);
au.addEventListener('play',()=>{if(!mv.hidden){mv.currentTime=au.currentTime;mv.play()}});au.addEventListener('pause',()=>mv.pause());au.addEventListener('seeked',()=>{if(!mv.hidden)mv.currentTime=au.currentTime});
const next=()=>{load(shuf?Math.floor(Math.random()*S.length):(i+1)%S.length);au.play()};
pp.onclick=()=>au.paused?au.play():au.pause();nx.onclick=next;pv.onclick=()=>{load((i-1+S.length)%S.length);au.play()};
sh.onclick=()=>{shuf=!shuf;sh.classList.toggle('off',!shuf)};rp.onclick=()=>{rep=!rep;au.loop=rep;rp.classList.toggle('off',!rep)};
au.onplay=()=>pp.textContent='⏸';au.onpause=()=>pp.textContent='▶';au.onended=next;vl.oninput=()=>au.volume=vl.value;au.volume=.8;
let drag=false;sk.oninput=()=>{drag=true;cur.textContent=f(sk.value/1000*au.duration)};sk.onchange=()=>{au.currentTime=sk.value/1000*au.duration;drag=false};
au.ontimeupdate=()=>{if(!au.duration)return;const p=au.currentTime/au.duration;if(!drag){sk.value=p*1000;cur.textContent=f(au.currentTime)}tot.textContent=f(au.duration)};
</script></body></html>
